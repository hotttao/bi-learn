# 008 local BI experiment. Source databases and Trino use explicit profiles.
# This S4 configuration does not implement authenticated department isolation.
name: bi008

x-superset: &superset
  image: bi008-superset:6.1.0
  build:
    context: ./superset
  environment:
    SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
    SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:?Run scripts/prepare_env.py first}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/prepare_env.py first}
  volumes:
    - ./superset/superset_config.py:/app/pythonpath/superset_config.py:ro
    - ./superset/bootstrap_admin.py:/app/pythonpath/bootstrap_admin.py:ro
  depends_on:
    metadata:
      condition: service_healthy

services:
  trino:
    profiles: [federation]
    # Official amd64 manifest: sha256:4b56ba858f31c4420df762015b63b0c0bcf712109d6401356732af43581c9cd3
    image: trinodb/trino:481
    environment:
      MYSQL_READER_PASSWORD: ${MYSQL_SOURCE_READER_PASSWORD:?Run scripts/prepare_env.py first}
      CRM_READER_PASSWORD: ${CRM_READER_PASSWORD:?Run scripts/prepare_env.py first}
    ports:
      - 127.0.0.1:18080:8080
    volumes:
      - ./trino:/etc/trino:ro
      - trino_data:/data/trino
    depends_on:
      mysql-source:
        condition: service_healthy
      crm-source:
        condition: service_healthy
    mem_limit: 2g
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS http://localhost:8080/v1/info | grep -q '"starting":false'
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  mysql-source:
    profiles: [sources]
    image: mysql:8.4.6
    environment:
      MYSQL_DATABASE: sales
      MYSQL_ROOT_HOST: localhost
      MYSQL_ROOT_PASSWORD: ${MYSQL_SOURCE_ROOT_PASSWORD:?Run scripts/prepare_env.py first}
      MYSQL_READER_PASSWORD: ${MYSQL_SOURCE_READER_PASSWORD:?Run scripts/prepare_env.py first}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
      - --innodb-buffer-pool-size=128M
      - --max-connections=30
    volumes:
      - mysql_source:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - 'MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysql --protocol=socket -uroot --batch --skip-column-names -e "SELECT 1" >/dev/null'
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s
    mem_limit: 768m

  crm-source:
    profiles: [sources]
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_DB: crm
      POSTGRES_USER: crm_owner
      POSTGRES_PASSWORD: ${CRM_OWNER_PASSWORD:?Run scripts/prepare_env.py first}
      CRM_READER_PASSWORD: ${CRM_READER_PASSWORD:?Run scripts/prepare_env.py first}
    command: [postgres, -c, timezone=Asia/Shanghai, -c, max_connections=30]
    volumes:
      - crm_source:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U crm_owner -d crm']
      interval: 5s
      timeout: 5s
      retries: 30
    mem_limit: 384m

  metadata:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_DB: superset
      POSTGRES_USER: superset
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/prepare_env.py first}
    volumes:
      - metadata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U superset -d superset']
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 512m

  superset-init:
    <<: *superset
    profiles: [init]
    environment:
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:?Run scripts/prepare_env.py first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/prepare_env.py first}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:?Run scripts/prepare_env.py first}
    command: [superset, db, upgrade]
    mem_limit: 1536m

  superset:
    <<: *superset
    ports:
      - ${SUPERSET_BIND_HOST:-192.168.2.46}:8088:8088
    command:
      - gunicorn
      - --bind=0.0.0.0:8088
      - --workers=1
      - --threads=4
      - --timeout=120
      - superset.app:create_app()
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8088/health', timeout=5)"
      interval: 15s
      timeout: 10s
      retries: 20
    mem_limit: 1536m

volumes:
  trino_data:
  metadata:
  mysql_source:
  crm_source:
